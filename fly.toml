# fly launch --no-deploy   then   fly deploy
app = "overgraze"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  OVERGRAZE_DB = "/data/overgraze.db"
  OVERGRAZE_RATE = "120"

# One machine, deliberately. See the note in the Dockerfile.
[http_service]
  internal_port = 8000
  force_https = true          # TLS is terminated by Fly; the app speaks plain HTTP
  auto_stop_machines = false  # stopping mid-run would strand every agent
  auto_start_machines = true
  min_machines_running = 1

  [http_service.http_options.response]
    pristine = true           # do not touch SSE framing on the /mcp stream

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/healthz"
  timeout = "5s"

[mounts]
  source = "overgraze_data"
  destination = "/data"
